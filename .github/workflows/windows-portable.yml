name: Windows portable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@10
      - name: Build interface
        shell: pwsh
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify Python code
        shell: pwsh
        run: python -m pytest -q
      - name: Package desktop app
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'portal-portable'
          python -m PyInstaller --noconfirm --clean --distpath $staging EmploymentPortalSearch.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $staging 'EmploymentPortalSearch') -Destination dist -Recurse
          if (-not (Test-Path 'dist/EmploymentPortalSearch/EmploymentPortalSearch.exe')) {
            throw 'Desktop executable was not produced.'
          }
      - name: Verify portable package
        shell: pwsh
        run: |
          $app = (Resolve-Path 'dist/EmploymentPortalSearch').Path
          $privateNames = @('portal.yaml', 'auth_state.bin', 'auth_preferences.json', 'playwright_state.json')
          $privateFiles = @(Get-ChildItem -LiteralPath $app -Recurse -File | Where-Object {
            $_.Name -in $privateNames -or $_.Extension -in @('.db', '.sqlite', '.sqlite3')
          })
          if ($privateFiles.Count) { throw 'Private runtime files must not be released.' }
          foreach ($package in @('torch', 'transformers', 'scipy', 'sklearn', 'pandas')) {
            if (Test-Path -LiteralPath (Join-Path $app "_internal/$package")) {
              throw "Unused dependency was bundled: $package"
            }
          }
          $report = Join-Path $env:RUNNER_TEMP 'portal-package-check.json'
          $process = Start-Process -FilePath (Join-Path $app 'EmploymentPortalSearch.exe') `
            -ArgumentList @('--self-check', '--self-check-report', "`"$report`"") `
            -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            throw 'Portable package self-check failed.'
          }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Portable package self-check did not pass.' }
          Get-Content -LiteralPath $report
      - name: Create portable archive and checksum
        shell: pwsh
        run: |
          $archive = 'EmploymentPortalSearch-windows-x64.zip'
          Compress-Archive -Path 'dist/EmploymentPortalSearch' -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii -NoNewline
      - name: Publish portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "portable-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag `
            'EmploymentPortalSearch-windows-x64.zip' `
            'EmploymentPortalSearch-windows-x64.zip.sha256' `
            --target $env:GITHUB_SHA `
            --title "Windows portable build $tag" `
            --notes-file RELEASE_NOTES.md `
            --latest
